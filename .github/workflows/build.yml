name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64
          # Geode 5.11.2 defaults to GD 2.2081; the game here is 2.2091
          configure-args: -DGEODE_GD_VERSION=2.2091 -DGEODE_COMP_GD_VERSION=22091

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-generator
          path: ${{ steps.build.outputs.build-output }}/*.geode
