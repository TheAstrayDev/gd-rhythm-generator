name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: Win64

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-generator
          path: ${{ steps.build.outputs.build-output }}/*.geode
